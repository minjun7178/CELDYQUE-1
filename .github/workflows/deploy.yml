name: CELDYQUE 통합 검사 및 배포

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# A preview PR must not cancel an in-progress main deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned validators
        run: npm ci

      - name: HTML Validation
        run: npm run lint:html

      - name: SEO Check
        run: python -B scripts/check_seo.py

      - name: Media, Amazon, retailer, navigation and optimization checks
        run: python -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Analytics, FAQ, media and partial-loading regression tests
        run: npm run test:unit

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Browser interaction regression tests
        run: npm run test:browser

      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage website files only
        run: python3 -B scripts/build_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
